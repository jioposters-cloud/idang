<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDA North Gujarat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #0d9488 0%, #0284c7 100%);
      color: white;
      padding: 40px 30px;
      text-align: center;
    }
    .header h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .header p {
      font-size: 0.95rem;
      opacity: 0.9;
    }
    .content {
      padding: 30px;
    }
    .section {
      margin-bottom: 25px;
    }
    .section h2 {
      font-size: 1.1rem;
      color: #1e3c72;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e2e8f0;
    }
    .section a {
      display: block;
      padding: 14px 20px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      text-decoration: none;
      color: #2a5298;
      font-weight: 600;
      margin-bottom: 10px;
      transition: all 0.2s;
    }
    .section a:hover {
      background: #2a5298;
      color: white;
    }
    .section a:last-child {
      margin-bottom: 0;
    }
    .footer {
      text-align: center;
      color: #94a3b8;
      padding: 20px;
      font-size: 0.85rem;
      border-top: 1px solid #e2e8f0;
    }
    @media (max-width: 480px) {
      .header h1 { font-size: 1.6rem; }
      .content { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>IDA North Gujarat</h1>
      <p>Indian Dental Association - North Gujarat Branch</p>
    </div>
    <div class="content">
      <div class="section">
        <h2>CDE Registration & View</h2>
        <a href="https://docs.google.com/forms/d/1IYZSrd5S7fagqnW4fcx9ATAqkC5Rb8V5phEfXCsPvLM/edit" target="_blank">
          Family Tour Registration Form
        </a>
        <a href="https://docs.google.com/forms/d/1IYZSrd5S7fagqnW4fcx9ATAqkC5Rb8V5phEfXCsPvLM/edit#responses" target="_blank">
          View Responses
        </a>
      </div>
      <div class="section">
        <h2>Bank Details</h2>
        <a href="#" onclick="copyToClipboard('73190100000020'); return false;">
          Account Number: 7319 0100 0000 20
        </a>
        <a href="#" onclick="copyToClipboard('BARB0DBDESA'); return false;">
          IFSC Code: BARB0DBDESA
        </a>
      </div>
      <div class="section">
        <h2>Social Media Connection</h2>
        <a href="https://www.facebook.com/share/1A47rtP4pm/" target="_blank">
          Facebook Page
        </a>
      </div>
    </div>
    <div class="footer">
      &copy; 2025 IDA North Gujarat. All rights reserved.
    </div>
  </div>
  <script>
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert('Copied: ' + text);
      }).catch(err => {
        console.error('Copy failed', err);
      });
    }
  </script>
</body>
</html>
